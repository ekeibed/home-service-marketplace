<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeFix – Browse Services</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap"
        rel="stylesheet" />
</head>

<body>

    <!-- NAVBAR -->
    <nav class="nav">
        <div class="logo">Home<span>Fix</span></div>
        <div class="nav-btns">
            <a href="my-account.html" class="nav-link">My Account</a>
            <button class="btn-outline" onclick="handleLogout()">Log out</button>
        </div>
    </nav>

    <!-- SEARCH & FILTER -->
    <section class="dash-search-section">
        <h1>Find a professional</h1>
        <p>Search by service or filter below</p>
        <div class="search-bar" style="max-width:560px;margin:20px auto 0;">
            <svg width="18" height="18" fill="none" stroke="#90caf9" stroke-width="2" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
            </svg>
            <input type="text" id="dashSearch" placeholder="e.g. Plumber, Cleaning..." oninput="filterEmployees()" />
            <button onclick="filterEmployees()">Search</button>
        </div>

        <!-- FILTERS -->
        <div class="filters">
            <div class="filter-group">
                <label>Service</label>
                <select id="filterService" onchange="filterEmployees()">
                    <option value="">All Services</option>
                    <option>Cleaning</option>
                    <option>Plumbing</option>
                    <option>Electrical</option>
                    <option>Painting</option>
                    <option>Carpentry</option>
                    <option>Moving</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Min Rating</label>
                <select id="filterRating" onchange="filterEmployees()">
                    <option value="">Any Rating</option>
                    <option value="4.5">4.5+</option>
                    <option value="4.0">4.0+</option>
                    <option value="3.5">3.5+</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Availability</label>
                <select id="filterAvail" onchange="filterEmployees()">
                    <option value="">Any</option>
                    <option value="available">Available Now</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Area</label>
                <select id="filterArea" onchange="filterEmployees()">
                    <option value="">All Areas</option>
                    <option>Üsküdar</option>
                    <option>Kadıköy</option>
                    <option>Ümraniye</option>
                    <option>Beşiktaş</option>
                </select>
            </div>



        </div>

        <!-- CATEGORY PILLS -->
        <div class="cat-pills">
            <span class="pill active" onclick="selectPill(this, '')">All</span>
            <span class="pill" onclick="selectPill(this, 'Cleaning')">🧹 Cleaning</span>
            <span class="pill" onclick="selectPill(this, 'Plumbing')">🔧 Plumbing</span>
            <span class="pill" onclick="selectPill(this, 'Electrical')">⚡ Electrical</span>
            <span class="pill" onclick="selectPill(this, 'Painting')">🎨 Painting</span>
            <span class="pill" onclick="selectPill(this, 'Carpentry')">🪚 Carpentry</span>
            <span class="pill" onclick="selectPill(this, 'Moving')">📦 Moving</span>
        </div>
    </section>

    <!-- EMPLOYEE GRID -->
    <section class="emp-grid-section">
        <div class="grid-header">
            <span id="resultCount">Showing 8 professionals</span>
        </div>
        <div class="emp-grid" id="empGrid">
            <!-- Cards injected by JS -->
        </div>
        <p class="no-results" id="noResults" style="display:none">No professionals found. Try a different search.</p>
    </section>

    <script src="app.js"></script>
</body>

</html>
